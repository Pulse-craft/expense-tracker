AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  expense-tracker backend

  SAM Template for expense-tracker

# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Function:
    Timeout: 3
    LoggingConfig:
      LogFormat: JSON
Resources:
  CreateExpenseFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: hello-world/
      Handler: app.lambdaHandler
      Runtime: nodejs22.x
      Architectures:
        - x86_64
      Environment:
        Variables:
          EXPENSES_TABLE_NAME: !Ref ExpensesTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ExpensesTable

      Events:
        CreateExpense:
          Type: Api
          Properties:
            Path: /expenses
            Method: post
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        Sourcemap: true
        EntryPoints:
          - app.ts
  ExpensesTable:
        Type: AWS::DynamoDB::Table
        Properties:
          TableName: !Sub "${AWS::StackName}-expenses"
          BillingMode: PAY_PER_REQUEST
          AttributeDefinitions:
            - AttributeName: PK
              AttributeType: S
            - AttributeName: SK
              AttributeType: S
          KeySchema:
            - AttributeName: PK
              KeyType: HASH
            - AttributeName: SK
              KeyType: RANGE

  ListExpensesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: list-expenses/
      Handler: app.lambdaHandler
      Runtime: nodejs22.x
      Architectures:
        - x86_64
      Environment:
        Variables:
          EXPENSES_TABLE_NAME: !Ref ExpensesTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ExpensesTable
      Events:
        ListExpenses:
          Type: Api
          Properties:
            Path: /expenses
            Method: get
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        Sourcemap: true
        EntryPoints:
          - app.ts

Outputs:
  CreateExpenseApi:
    Description: API Gateway endpoint URL for Prod stage for Create Expense function
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/expenses/"
  CreateExpenseFunction:
    Description: Create Expense Lambda Function ARN
    Value: !GetAtt CreateExpenseFunction.Arn
  CreateExpenseFunctionIamRole:
    Description: Implicit IAM Role created for Create Expense function
    Value: !GetAtt CreateExpenseFunctionRole.Arn